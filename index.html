const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toUpperCase().trim();
const rid = () => Math.random().toString(36).slice(2, 8).toUpperCase();
const fmtT = ms => (Math.max(0, ms) / 1000).toFixed(2) + 's';
function makePins(n) { const s = new Set(); while (s.size < n) s.add(String(100000 + Math.floor(Math.random() * 900000))); return [...s]; }

/* ===================== KẾT NỐI =====================
   1) Có FIREBASE_CONFIG  → dùng Firebase.
   2) Không có            → tự kết nối trực tiếp qua Internet (PeerJS): máy GV mở 1 "cổng" cho mỗi mã PIN,
                             máy đội nhập PIN là nối thẳng vào máy GV. Không cần cài đặt gì.
   3) Cùng 1 trình duyệt   → các tab nói chuyện trực tiếp với nhau (không cần Internet). */
const PEER_PREFIX = 'edugame-olympia-v1-';
const Net = {
  mode: 'local', offset: 0, db: null, bc: null,
  peers: {}, peerOk: {}, wantPins: [], conns: new Set(), actCb: null, lastPub: null, onStatus: null,
  peer: null, conn: null, via: null, p2pPub: null, pubCb: null, onLost: null, err: '', _fin: null,
  init() {
    if (FIREBASE_CONFIG && window.firebase) {
      firebase.initializeApp(FIREBASE_CONFIG); this.db = firebase.database(); this.mode = 'firebase';
      this.db.ref('.info/serverTimeOffset').on('value', s => this.offset = s.val() || 0);
      return;
    }
    if ('BroadcastChannel' in window) this.bc = new BroadcastChannel('olympia_live_v1');
    if (window.Peer) this.mode = 'p2p';
  },
  now() { return Date.now() + this.offset; },
  /* ---------- phía giáo viên ---------- */
  publish(roomId, pub) {
    const s = JSON.stringify(pub);
    if (this.db) return this.db.ref(`olp/rooms/${roomId}/pub`).set(s);
    try { localStorage.setItem('olp_pub', s); localStorage.setItem('olp_alive', Date.now()); } catch (e) { }
    this.bc && this.bc.postMessage({ k: 'pub', s });
    this.lastPub = s;
    this.conns.forEach(c => { if (c.open) try { c.send({ k: 'pub', s, now: Date.now() }); } catch (e) { } });
  },
  heartbeat() { try { localStorage.setItem('olp_alive', Date.now()); } catch (e) { } },
  registerPins(roomId, pins, oldPins = []) {
    if (this.db) {
      oldPins.forEach(p => p && !pins.includes(p) && this.db.ref(`olp/pins/${p}`).remove());
      pins.forEach(p => this.db.ref(`olp/pins/${p}`).set(roomId));
      return;
    }
    if (this.mode !== 'p2p') return;
    this.wantPins = pins.filter(Boolean);
    Object.keys(this.peers).forEach(p => { if (!this.wantPins.includes(p)) { try { this.peers[p].destroy(); } catch (e) { } delete this.peers[p]; delete this.peerOk[p]; } });
    this.wantPins.forEach(p => this.peers[p] || this.openPeer(p));
  },
  openPeer(pin) {
    const peer = new Peer(PEER_PREFIX + pin, window.PEER_OPTIONS || {});
    this.peers[pin] = peer; this.peerOk[pin] = 'connecting';
    const status = st => { this.peerOk[pin] = st; this.onStatus && this.onStatus(); };
    peer.on('open', () => status('ok'));
    peer.on('connection', c => {
      c.on('open', () => { this.conns.add(c); if (this.lastPub) c.send({ k: 'pub', s: this.lastPub, now: Date.now() }); });
      c.on('data', d => { if (d && d.k === 'act' && this.actCb) { d.a.ts = Date.now(); this.actCb(d.a); } });
      c.on('close', () => this.conns.delete(c)); c.on('error', () => this.conns.delete(c));
    });
    peer.on('disconnected', () => { if (this.peers[pin] === peer && !peer.destroyed) { status('connecting'); setTimeout(() => { try { peer.reconnect(); } catch (e) { } }, 1500); } });
    peer.on('error', e => {
      if (this.peers[pin] !== peer) return;
      if (e.type === 'unavailable-id') {           // mã cũ chưa được máy chủ giải phóng (vd. vừa tải lại trang) → thử lại
        status('connecting'); try { peer.destroy(); } catch (_) { } delete this.peers[pin];
        setTimeout(() => { if (!this.peers[pin] && this.wantPins.includes(pin)) this.openPeer(pin); }, 3000);
      } else if (['network', 'server-error', 'socket-error', 'socket-closed', 'browser-incompatible'].includes(e.type)) {
        status('error'); setTimeout(() => { if (this.peers[pin] === peer) { try { peer.destroy(); } catch (_) { } delete this.peers[pin]; this.openPeer(pin); } }, 4000);
      }
    });
  },
  listenActions(roomId, cb) {
    if (this.db) {
      this.db.ref(`olp/rooms/${roomId}/actions`).on('child_added', s => {
        const v = s.val(); s.ref.remove();
        try { const a = JSON.parse(v.d); a.ts = v.ts; cb(a); } catch (e) { }
      });
      return;
    }
    this.actCb = cb;
    this.bc && this.bc.addEventListener('message', e => { if (e.data && e.data.k === 'act') cb(e.data.a); });
  },
  /* ---------- phía máy đội ---------- */
  async resolvePin(pin) {
    this.err = '';
    if (this.db) { const s = await this.db.ref(`olp/pins/${pin}`).get(); return s.val(); }
    try {   // máy GV mở trên cùng trình duyệt này
      const alive = +localStorage.getItem('olp_alive') || 0, p = JSON.parse(localStorage.getItem('olp_pub') || 'null');
      if (p && (p.phase === 'lobby' || p.phase === 'game') && Date.now() - alive < 7000) { this.via = 'local'; return p.roomId; }
    } catch (e) { }
    if (this.mode !== 'p2p') { this.err = 'nolib'; return null; }
    return await this.p2pConnect(pin);
  },
  p2pConnect(pin) {
    return new Promise(res => {
      let done = false;
      const fin = v => { if (!done) { done = true; clearTimeout(to); this._fin = null; res(v); } };
      this._fin = fin;
      const to = setTimeout(() => { this.err = this.err || 'timeout'; fin(null); }, 12000);
      const start = () => {
        if (this.conn) { try { this.conn.close(); } catch (e) { } this.conn = null; }

        c.on('data', d => {
          if (!d || d.k !== 'pub') return;

      };
      if (!this.peer || this.peer.destroyed || this.peer.disconnected) {
        try { this.peer && this.peer.destroy(); } catch (e) { }
        this.peer = new Peer(window.PEER_OPTIONS || {});
        this.peer.on('open', () => start());
        this.peer.on('error', e => { this.err = e.type; this._fin && this._fin(null); });
      } else start();
    });
  },
  listenPub(roomId, cb) {
    if (this.db) { this.db.ref(`olp/rooms/${roomId}/pub`).on('value', s => { const v = s.val(); if (v) cb(JSON.parse(v)); }); return; }
    this.pubCb = p => { if (p.roomId === roomId) cb(p); };
    if (this.via === 'p2p') { if (this.p2pPub) this.pubCb(this.p2pPub); return; }
    const read = () => { try { const p = JSON.parse(localStorage.getItem('olp_pub') || 'null'); if (p && this.via === 'local') this.pubCb(p); } catch (e) { } };
    read();
    if (!this._localBound) {
      this._localBound = true;
      this.bc && this.bc.addEventListener('message', e => { if (this.via === 'local' && e.data && e.data.k === 'pub') this.pubCb && this.pubCb(JSON.parse(e.data.s)); });

  send(roomId, a) {
    if (this.db) return this.db.ref(`olp/rooms/${roomId}/actions`).push({ d: JSON.stringify(a), ts: firebase.database.ServerValue.TIMESTAMP });
    if (this.via === 'p2p' && this.conn && this.conn.open) return this.conn.send({ k: 'act', a });
    a.ts = Date.now(); this.bc && this.bc.postMessage({ k: 'act', a });
  }
};


/* ===================== VĂN BẢN GIÀU: in đậm, xuống dòng, hình TikZ, \immini =====================
   Câu hỏi/đáp án có thể chứa các "mã đánh dấu" ⟦...⟧ do bộ đọc file LaTeX sinh ra. */
const TIKZ_SERVICE = 'https://i.upmath.me/svg/';   // dịch vụ vẽ LaTeX/TikZ trực tuyến (miễn phí)
function rich(t) {
  t = String(t ?? '');
  if (t.indexOf('⟦') < 0) return esc(t);
  return t.split(/(⟦[^⟧]*⟧)/).map(part => {
    const m = part.match(/^⟦([^:⟧]+)(?::([^⟧]*))?⟧$/);
    if (!m) return esc(part);
    switch (m[1]) {
      case 'b': return '<b>'; case '/b': return '</b>'; case 'i': return '<i>'; case '/i': return '</i>'; case 'u': return '<u>'; case '/u': return '</u>';
      case 'br': return '<br>';
      case 'IM': return '<span class="immini"><span class="immini-t">'; case 'IMS': return '</span><span class="immini-f">'; case '/IM': return '</span></span>';
      case 'T': return `<img class="tikz" alt="Hình vẽ" loading="lazy" src="${TIKZ_SERVICE}${m[2]}" onload="this.style.width=Math.min(this.naturalWidth*1.8,560)+'px'" onerror="this.outerHTML='<span class=&quot;tikz-miss&quot;>⚠ Không vẽ được hình TikZ – kiểm tra Internet hoặc mã hình</span>'">`;
      case 'F': return `<span class="tikz-miss">🖼 Hình: ${esc(decodeURIComponent(m[2] || ''))} (chưa hỗ trợ ảnh từ file)</span>`;
    }
    return esc(part);
  }).join('');
}

  if (p.status === 'intro') return waitBox(`Vòng ${p.round}: ${ROUND_NAMES[p.round]}`, 'Chờ giáo viên bắt đầu vòng thi…', `<p class="mt-4 text-sm text-slate-600 max-w-xl mx-auto">${roundRule(p.round)}</p>`);
  if (p.status === 'review') return reviewTeam(p, t);
  if (p.round === 1) return r1Team(p, t, ctx);
  if (p.round === 2) return r2Team(p, t, ctx);
  if (p.round === 3) return r3Team(p, t, ctx);
  if (p.round === 4) return r4Team(p, t, ctx);
  if (p.round === 5) return r5Team(p, t, ctx);
  return '';
}

function r1Team(p, t, ctx) {
  const v = p.view, now = Net.now();
  if (now < v.startAt) { rerenderAt(v.startAt); return `<div class="card p-12 text-center"><div class="text-slate-500 font-bold">Vòng 1 – Khởi động bắt đầu sau</div><div class="text-8xl font-black text-violet-600 mt-3" data-until="${v.startAt}">3</div></div>`; }
  rerenderAt(v.deadline);
  const set = v.sets[t], prog = v.prog[t], i = prog.length;
  const strip = `<div class="flex gap-1.5">${set.map((_, k) => {
    const c = k < prog.length ? (prog[k].ok ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white') : k === i ? 'bg-violet-600 text-white' : 'bg-slate-200 text-slate-500';
    const ic = k < prog.length ? (prog[k].ok ? '✓' : '✗') : k + 1;
    return `<div class="w-8 h-8 rounded-lg grid place-items-center text-xs font-black ${c}">${ic}</div>`; }).join('')}</div>`;
  const last = prog[prog.length - 1];
  const fb = last ? `<div class="text-sm font-bold ${last.ok ? 'text-emerald-600' : 'text-rose-600'}">Câu vừa rồi: ${last.ok ? 'Đúng! +' + RULES.R1_POINT + 'đ' : 'Chưa đúng – đáp án là ' + L[last.a]}</div>` : '';
  if (i >= set.length || now > v.deadline) {
    const c = prog.filter(x => x.ok).length;
    return `<div class="space-y-4">${timerHTML(v.deadline, RULES.R1_TIME)}<div class="card p-6 flex flex-wrap items-center justify-between gap-3">${strip}</div>
      ${waitBox(i >= set.length ? 'Đội bạn đã hoàn thành!' : 'Hết giờ!', `Đúng ${c}/${set.length} câu • +${c * RULES.R1_POINT} điểm. Chờ các đội khác…`)}</div>`;
  }
  const q = set[i], pend = ctx.pend && ctx.pend.type === 'r1' && ctx.pend.idx === i;
  return `<div class="space-y-4">${timerHTML(v.deadline, RULES.R1_TIME)}
    <div class="card p-4 flex flex-wrap items-center justify-between gap-3">${strip}${fb}</div>
    <div class="card qcard p-5 sm:p-7 pop"><div class="text-xs font-black text-violet-600 uppercase tracking-wider mb-2">Câu ${i + 1}/${set.length}</div>
      <div class="text-xl sm:text-2xl font-black text-slate-900 mb-5 leading-snug">${rich(q.text)}</div>
      ${optsHTML(q.opts, { act: 'r1', extra: `data-i="${i}"`, disabled: ctx.ro || pend, chosen: pend ? ctx.pend.c : -1 })}</div></div>`;
}

function rowsBoard(v) {
  return `<div class="grid gap-2">${v.rows.map((r, i) => {
    const playing = v.row === i && v.rs === 'play';
    return `<div class="flex items-center gap-3 rounded-xl px-3 py-2 border-2 ${playing ? 'border-violet-500 bg-violet-50' : r.open ? 'border-emerald-300 bg-emerald-50' : 'border-slate-200 bg-white'}">
      <div class="w-8 h-8 rounded-lg grid place-items-center font-black text-white ${r.open ? 'bg-emerald-600' : playing ? 'bg-violet-600' : 'bg-slate-400'}">${i + 1}</div>
      <div class="font-black tracking-wide ${r.open ? 'text-emerald-800' : 'text-slate-400'}">${r.open ? rich(r.key) : playing ? 'Đang hỏi…' : '? ? ? ? ?'}</div></div>`; }).join('')}</div>`;
}
function r2Team(p, t, ctx) {
  const v = p.view, my = v.cnvTry[t];
  const cnvVal = v.opened ? RULES.CNV_POINTS[Math.min(v.opened, RULES.CNV_POINTS.length) - 1] : 0;
  let main = '';
  if (p.status === 'final') {
    rerenderAt(v.finalDl);
    main = my ? waitBox(my.ok ? 'Đội bạn đã đoán ĐÚNG chướng ngại vật!' : 'Đã gửi câu trả lời CNV', 'Chờ hết giờ…')
      : `<div class="card p-6 pop">${timerHTML(v.finalDl, RULES.CNV_FINAL_TIME)}<div class="text-xs font-black text-amber-600 uppercase mt-4 mb-2">Cơ hội cuối – đoán chướng ngại vật (+${RULES.CNV_POINTS[RULES.CNV_POINTS.length - 1]}đ)</div>
        <div class="text-xl font-black mb-4">${rich(v.cnv.text)}</div>${optsHTML(v.cnv.opts, { act: 'cnv', disabled: ctx.ro || !!ctx.pend, chosen: ctx.pend && ctx.pend.type === 'cnv' ? ctx.pend.c : -1 })}</div>`;
  } else if (ctx.cnvOpen && v.cnv && !my && !ctx.ro) {
    main = `<div class="card p-6 border-2 border-amber-400 pop"><div class="flex items-center justify-between mb-3"><div class="text-xs font-black text-amber-600 uppercase">Đoán chướng ngại vật • đúng +${cnvVal}đ • sai mất quyền</div><button class="btn btn-soft" data-a="cnvClose">Hủy</button></div>
      <div class="text-xl font-black mb-4">${rich(v.cnv.text)}</div>${optsHTML(v.cnv.opts, { act: 'cnv', disabled: !!ctx.pend, chosen: ctx.pend && ctx.pend.type === 'cnv' ? ctx.pend.c : -1 })}</div>`;
  } else if (v.rs === 'play') {
    rerenderAt(v.deadline);
    const r = v.rows[v.row], a = v.ans[v.row][t], pend = ctx.pend && ctx.pend.type === 'r2' && ctx.pend.row === v.row;
    main = `<div class="card qcard p-5 sm:p-7 pop">${timerHTML(v.deadline, RULES.R2_ROW_TIME)}
      <div class="text-xs font-black text-violet-600 uppercase mt-4 mb-2">Hàng ngang ${v.row + 1}</div><div class="text-xl sm:text-2xl font-black mb-5">${rich(r.text)}</div>
      ${optsHTML(r.opts, { act: 'r2', extra: `data-row="${v.row}"`, disabled: ctx.ro || !!a || pend, chosen: a ? a.c : pend ? ctx.pend.c : -1 })}
      ${a ? `<div class="mt-4 text-sm font-bold text-slate-500"><i class="fa-solid fa-lock"></i> Đã chốt đáp án ${L[a.c]} sau ${fmtT(a.t)} – chờ hết giờ</div>` : ''}</div>`;
  } else {
    const last = v.row >= 0 ? v.rows[v.row] : null, a = last ? v.ans[v.row][t] : null;
    main = last ? `<div class="card p-6 pop"><div class="text-xs font-black text-emerald-600 uppercase mb-2">Đáp án hàng ngang ${v.row + 1}</div><div class="text-lg font-black mb-4">${rich(last.text)}</div>
      ${optsHTML(last.opts, { disabled: true, chosen: a ? a.c : -1, correct: last.ans })}
      <div class="mt-4 font-black ${a && a.ok ? 'text-emerald-600' : 'text-rose-600'}">${a ? (a.ok ? `Đội bạn trả lời đúng (+${RULES.R2_POINT}đ) • ${fmtT(a.t)}` : 'Đội bạn trả lời chưa đúng') : 'Đội bạn chưa trả lời'}</div>
      <div class="text-slate-500 text-sm mt-1">Chờ giáo viên mở hàng ngang tiếp theo…</div></div>` : waitBox('Chờ giáo viên mở hàng ngang đầu tiên');
  }
  let cnvBox = '';
  if (v.hasCnv && p.status === 'play') {
    if (my) cnvBox = `<div class="card p-4 text-center font-black ${my.ok ? 'text-emerald-600' : 'text-rose-600'}">${my.ok ? `Đoán đúng CNV! +${my.pts}đ` : 'Đoán CNV chưa đúng – đội bạn đã mất quyền đoán'}</div>`;
    else if (v.opened && !ctx.cnvOpen) cnvBox = `<button class="btn btn-dark w-full py-4 text-base" data-a="cnvOpen" ${ctx.ro ? 'disabled' : ''}><i class="fa-solid fa-bell text-amber-400"></i> ĐOÁN CHƯỚNG NGẠI VẬT (+${cnvVal}đ)</button>`;
    else if (!v.opened) cnvBox = `<div class="text-center text-xs font-bold text-slate-400">Mở được ít nhất 1 hàng ngang mới được đoán chướng ngại vật</div>`;
  }
  return `<div class="grid lg:grid-cols-[1fr_280px] gap-4"><div class="space-y-4">${main}${cnvBox}</div>
    <div class="card p-4 space-y-3 h-fit"><div class="text-xs font-black uppercase text-slate-500">Các hàng ngang</div>${rowsBoard(v)}
    <div class="rounded-xl bg-slate-900 text-white p-3 text-center"><div class="text-[10px] uppercase font-bold text-slate-400">Chướng ngại vật</div><div class="text-lg font-black tracking-widest">? ? ?</div></div></div></div>`;
}

function r3Team(p, t, ctx) {
  const v = p.view;
  if (v.q < 0) return waitBox('Chờ giáo viên mở câu hỏi Tăng tốc đầu tiên', roundRule(3));
  const a = v.answers[t];
  if (v.qs === 'play') {
    rerenderAt(v.deadline);
    const pend = ctx.pend && ctx.pend.type === 'r3' && ctx.pend.q === v.q;
    return `<div class="card qcard p-5 sm:p-7 pop">${timerHTML(v.deadline, RULES.R3_TIME)}
      <div class="text-xs font-black text-sky-600 uppercase mt-4 mb-2">Tăng tốc • Câu ${v.q + 1}/${v.n} • nhanh nhất +${RULES.R3_POINTS[0]}đ</div>
      <div class="text-xl sm:text-2xl font-black mb-5">${rich(v.text)}</div>
      ${optsHTML(v.opts, { act: 'r3', extra: `data-q="${v.q}"`, disabled: ctx.ro || !!a || pend, chosen: a ? a.c : pend ? ctx.pend.c : -1 })}
      ${a ? `<div class="mt-4 text-sm font-bold text-slate-500"><i class="fa-solid fa-stopwatch"></i> Đã chốt ${L[a.c]} sau ${fmtT(a.t)} – chờ các đội khác</div>` : ''}</div>`;
  }
  const pts = v.award[t] || 0;
  return `<div class="card p-6 pop"><div class="text-xs font-black text-emerald-600 uppercase mb-2">Đáp án câu ${v.q + 1}</div><div class="text-lg font-black mb-4">${rich(v.text)}</div>
    ${optsHTML(v.opts, { disabled: true, chosen: a ? a.c : -1, correct: v.ans })}
    <div class="mt-4 font-black text-lg ${pts ? 'text-emerald-600' : 'text-rose-600'}">${a ? (a.ok ? `Đúng sau ${fmtT(a.t)} • +${pts}đ` : 'Chưa đúng') : 'Đội bạn chưa trả lời'}</div>
    <div class="text-slate-500 text-sm mt-1">Chờ giáo viên chuyển câu…</div></div>`;
}

function r4Head(p) {
  const v = p.view, act = p.teams[v.active];
  const chips = v.pts.length ? v.pts.map((x, i) => {
    const h = v.hist[i]; const c = h === 'ok' ? 'bg-emerald-500 text-white' : h === 'bad' ? 'bg-rose-500 text-white' : h === 'steal' ? 'bg-amber-500 text-white' : i === v.qi ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-500';
    return `<span class="px-2.5 py-1 rounded-lg text-xs font-black ${c}">Câu ${i + 1}: ${x}đ${v.star === i ? ' ⭐' : ''}</span>`; }).join('') : '';
  return `<div class="card p-4 flex flex-wrap items-center justify-between gap-3" style="border-left:6px solid ${act.color}">
    <div class="flex items-center gap-2"><span class="text-xs font-bold text-slate-500">Lượt thi:</span>${badge(act)}${v.pkg ? `<span class="text-xs font-black text-slate-700">Gói ${v.pkg}đ</span>` : ''}</div><div class="flex flex-wrap gap-1.5">${chips}</div></div>`;
}
function r4Outcome(p) {
  const v = p.view, act = p.teams[v.active], pts = v.pts[v.qi];
  if (!v.main) return '';
  let s = '';
  if (v.main.ok) s = `<span class="text-emerald-600">${esc(act.name)} trả lời ĐÚNG • +${pts * (v.star === v.qi ? 2 : 1)}đ${v.star === v.qi ? ' (Ngôi sao ×2)' : ''}</span>`;
  else {
    s = `<span class="text-rose-600">${esc(act.name)} ${v.main.c < 0 ? 'hết giờ' : 'trả lời chưa đúng'}${v.star === v.qi ? ` • bị trừ ${pts}đ (Ngôi sao)` : ''}</span>`;
    if (v.buzzer >= 0 && v.steal) s += `<br><span class="${v.steal.ok ? 'text-emerald-600' : 'text-rose-600'}">${esc(p.teams[v.buzzer].name)} giành quyền và trả lời ${v.steal.ok ? `ĐÚNG • +${pts}đ` : `SAI • −${pts / 2}đ`}</span>`;
    else if (v.st === 'reveal') s += `<br><span class="text-slate-500">Không đội nào giành quyền trả lời</span>`;
  }
  return `<div class="mt-4 text-lg font-black leading-relaxed">${s}</div>`;
}
function r4Team(p, t, ctx) {
  const v = p.view, isMain = t === v.active, act = p.teams[v.active], pts = v.pts[v.qi];
  const head = r4Head(p);
  if (v.st === 'pick') {
    if (!isMain) return head + `<div class="mt-4">${waitBox(`${esc(act.name)} đang chọn gói câu hỏi`, 'Hãy theo dõi – khi đội bạn đang thi trả lời sai, đội bạn có thể bấm chuông giành quyền!')}</div>`;
    const pk = ctx.pick || { pkg: 0, star: -1 };
    return head + `<div class="card p-6 mt-4 pop"><div class="text-xl font-black mb-1">Chọn gói câu hỏi Về đích</div><div class="text-sm text-slate-500 mb-4">${roundRule(4)}</div>
      <div class="grid sm:grid-cols-3 gap-3">${Object.entries(RULES.PACKAGES).map(([k, arr]) => `<button class="rounded-2xl p-5 border-2 text-left transition ${pk.pkg == k ? 'border-violet-600 bg-violet-50' : 'border-slate-200 hover:border-violet-300'}" data-a="pkg" data-pkg="${k}" ${ctx.ro ? 'disabled' : ''}>
        <div class="text-3xl font-black">${k}<span class="text-base">đ</span></div><div class="text-xs font-bold text-slate-500 mt-1">${arr.join(' + ')} điểm</div></button>`).join('')}</div>
      ${pk.pkg ? `<div class="mt-5"><div class="text-sm font-black mb-2">⭐ Ngôi sao hy vọng (tùy chọn): đặt vào câu nào?</div><div class="flex flex-wrap gap-2">
        <button class="btn ${pk.star < 0 ? 'btn-dark' : 'btn-soft'}" data-a="star" data-s="-1" ${ctx.ro ? 'disabled' : ''}>Không dùng</button>
        ${RULES.PACKAGES[pk.pkg].map((x, i) => `<button class="btn ${pk.star === i ? 'btn-dark' : 'btn-soft'}" data-a="star" data-s="${i}" ${ctx.ro ? 'disabled' : ''}>Câu ${i + 1} (${x}đ)</button>`).join('')}</div>
        <button class="btn btn-pri w-full mt-5 py-4 text-base" data-a="pickGo" ${ctx.ro || ctx.pend ? 'disabled' : ''}><i class="fa-solid fa-check"></i> Chốt gói ${pk.pkg}đ</button></div>` : ''}</div>`;
  }
  if (v.st === 'ready') return head + `<div class="mt-4">${waitBox(`Chuẩn bị câu ${v.qi + 1} – ${pts} điểm${v.star === v.qi ? ' ⭐' : ''}`, 'Chờ giáo viên hiện câu hỏi…')}</div>`;
  if (v.st !== 'reveal') rerenderAt(v.deadline);
  let body = `<div class="text-xs font-black text-pink-600 uppercase mb-2">Câu ${v.qi + 1} • ${pts} điểm${v.star === v.qi ? ' • ⭐ Ngôi sao hy vọng' : ''}</div><div class="text-xl sm:text-2xl font-black mb-5">${rich(v.text)}</div>`;
  const pend = ctx.pend && ['r4ans', 'r4steal', 'buzz'].includes(ctx.pend.type);
  if (v.st === 'answer') {
    body = timerHTML(v.deadline, v.total) + '<div class="mt-4"></div>' + body +
      optsHTML(v.opts, { act: 'r4', disabled: ctx.ro || !isMain || pend, chosen: pend ? ctx.pend.c : -1 }) +
      (isMain ? '' : `<div class="mt-4 text-center font-bold text-slate-500">${esc(act.name)} đang trả lời…</div>`);
  } else if (v.st === 'buzz') {
    body = timerHTML(v.deadline, RULES.BUZZ_TIME) + '<div class="mt-4"></div>' + body + optsHTML(v.opts, { disabled: true, wrong: v.main.c }) +
      (isMain ? `<div class="mt-5 text-center font-black text-rose-600">Chưa đúng – các đội khác có ${RULES.BUZZ_TIME} giây bấm chuông</div>`
        : `<div class="mt-6 grid place-items-center"><button class="bell grid place-items-center" data-a="buzz" ${ctx.ro || pend ? 'disabled' : ''}><i class="fa-solid fa-bell"></i></button><div class="mt-3 font-black text-amber-700">BẤM CHUÔNG GIÀNH QUYỀN!</div></div>`);
  } else if (v.st === 'steal') {
    const me = t === v.buzzer;
    body = timerHTML(v.deadline, RULES.STEAL_TIME) + '<div class="mt-4"></div>' + body +
      optsHTML(v.opts, { act: 'steal', disabled: ctx.ro || !me || pend, wrong: v.main.c, chosen: pend ? ctx.pend.c : -1 }) +
      `<div class="mt-4 text-center font-black text-amber-700"><i class="fa-solid fa-bell"></i> ${me ? 'Đội bạn đã giành quyền – chọn đáp án!' : esc(p.teams[v.buzzer].name) + ' đã giành quyền trả lời'}</div>`;
  } else {
    body += optsHTML(v.opts, { disabled: true, correct: v.ans, chosen: v.main ? v.main.c : -1, wrong: v.steal ? v.steal.c : -1 }) + r4Outcome(p);
  }
  return head + `<div class="card qcard p-5 sm:p-7 mt-4 pop">${body}</div>`;
}

function reviewTeam(p, t) {
  const rk = rankOf(p.teams), pos = rk.findIndex(x => x.i === t) + 1;
  let extra = '';
  if (p.round === 1 && p.view) { const pr = p.view.prog[t]; extra = `<div class="mt-2 text-slate-600 font-bold">Vòng Khởi động: đúng ${pr.filter(x => x.ok).length}/${p.view.sets[t].length} câu</div>`; }
  if (p.round === 2 && p.view && p.view.cnv && p.view.cnv.ans >= 0) extra = `<div class="mt-2 text-slate-600 font-bold">Chướng ngại vật: <span class="text-emerald-700">${rich(p.view.cnv.opts[p.view.cnv.ans])}</span>${p.view.solved >= 0 ? ` – ${esc(p.teams[p.view.solved].name)} đoán đúng` : ''}</div>`;
  return `<div class="card p-8 text-center pop"><div class="text-sm font-black text-violet-600 uppercase">Kết thúc vòng ${p.round}: ${ROUND_NAMES[p.round]}</div>
    <div class="text-5xl font-black mt-3">${p.teams[t].score}<span class="text-xl"> điểm</span></div><div class="mt-1 font-bold text-slate-500">Đội bạn đang xếp hạng ${pos}/${p.teams.length}</div>${extra}
    <div class="mt-6">${scoreStrip(p, t)}</div><div class="mt-4 text-sm text-slate-400 font-semibold">Chờ giáo viên chuyển sang vòng tiếp theo…</div></div>`;
}
function finalBoard(p, me = -1) {
  const rk = rankOf(p.teams), medal = ['🥇', '🥈', '🥉', '🎖️', '🎖️', '🎖️'];
  return `<div class="card p-6 sm:p-10 text-center pop"><div class="flex justify-center mb-3">${champMark('w-20 h-20')}</div><div class="text-sm font-black text-violet-600 uppercase tracking-wider">EDU Champions • Kết quả chung cuộc</div>
    <div class="text-3xl sm:text-4xl font-black mt-2">🏆 ${esc(rk[0].name)} về nhất!</div>
    <div class="mt-6 space-y-2 max-w-xl mx-auto">${rk.map((x, k) => `<div class="flex items-center justify-between rounded-2xl px-4 py-3 border-2 ${x.i === me ? 'bg-violet-50' : 'bg-white'}" style="border-color:${x.color}">
      <div class="flex items-center gap-3 font-black"><span class="text-2xl">${medal[k]}</span>${esc(x.name)}${x.tb > 0 ? '<span class="text-[10px] font-black px-2 py-0.5 rounded-full bg-amber-100 text-amber-700"><i class="fa-solid fa-scale-balanced"></i> thắng câu hỏi phụ</span>' : ''}${rk.some(y => y.i !== x.i && y.score === x.score && (y.tb || 0) === (x.tb || 0)) ? '<span class="text-[10px] font-black px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">đồng hạng</span>' : ''}</div><div class="text-2xl font-black tabular-nums">${x.score}</div></div>`).join('')}</div></div>`;
}

/* =====================================================================
   PHẦN GIÁO VIÊN (MÁY CHỦ TRÒ)
   ===================================================================== */
let H = null; const UI = { tab: 'main', showPin: {}, confetti: false, msg: '', side: window.innerWidth >= 1024 };
function hostDefault() {
  return {
    roomId: rid(), students: [],
    teams: Array.from({ length: RULES.TEAM_COUNT }, (_, i) => ({ name: `Đội ${i + 1}`, color: COLORS[i], members: [], pin: '', dev: null, score: 0 })),
    bankText: SAMPLE_BANK, bankName: 'Bộ câu hỏi mẫu – KHTN 8 (Chương I–II)', phase: 'setup', g: null, rejects: {}
  };
}
function save() { try { localStorage.setItem('olp_host', JSON.stringify(H)); } catch (e) { } }
function commit() { save(); if (H.phase !== 'setup') Net.publish(H.roomId, buildPub()); renderHost(); }
let listening = false;
function listen() { if (!listening) { listening = true; Net.listenActions(H.roomId, onAction); } }

function hostInit() {
  try { H = JSON.parse(localStorage.getItem('olp_host') || 'null'); } catch (e) { }
  if (!H || !H.teams) H = hostDefault();
  if (H.phase !== 'setup') { Net.registerPins(H.roomId, H.teams.map(t => t.pin)); listen(); }
  setInterval(hostTick, 250);
  setInterval(() => { if (H.phase !== 'setup') Net.heartbeat(); }, 2000);
  Net.onStatus = () => { if (H.phase === 'lobby') renderHost(); };
  commit();
}

function buildPub() {
  const p = { roomId: H.roomId, phase: H.phase, teams: H.teams.map(t => ({ name: t.name, color: t.color, members: t.members, dev: t.dev, score: t.score, tb: t.tb || 0 })), rejects: H.rejects };

      rows: b.r2.map((q, i) => { const show = i === r.row || r.opened[i] || rev, open = r.opened[i] || rev; return { text: show ? q.text : null, opts: show ? q.opts : null, ans: open ? q.ans : -1, key: open ? q.opts[q.ans] : null, open }; }),
      ans: r.ans.map((row, i) => row.map(a => a ? { c: a.c, t: a.t, ok: (r.opened[i] || rev) ? a.ok : null } : null)),
      cnv: b.cnv && (r.opened.some(Boolean) || g.status !== 'play') ? { text: b.cnv.text, opts: b.cnv.opts, ans: rev ? b.cnv.ans : -1 } : null,

      answers: r.q >= 0 ? r.ans[r.q].map(a => a ? { c: a.c, t: a.t, ok: rev ? a.ok : null } : null) : [], award: r.q >= 0 ? r.award[r.q] : [] };

}

/* ---------- Xử lý thao tác từ các đội ---------- */
function onAction(a) {
  if (!a || !a.type) return;
  if (a.type === 'join') { onJoin(a); return commit(); }
  const t = a.team; if (!(t >= 0 && t < H.teams.length) || H.teams[t].dev !== a.dev || H.phase !== 'game') return;
  const g = H.g;
  if (a.type === 'r1' && g.round === 1) onR1(a);
  else if (a.type === 'r2' && g.round === 2) onR2(a);
  else if (a.type === 'cnv' && g.round === 2) onCnv(a);
  else if (a.type === 'r3' && g.round === 3) onR3(a);
  else if (g.round === 4 && g.r4 && g.status === 'play') {
    const r = g.r4;
    if (a.type === 'r4pick' && r.st === 'pick' && t === r.order[r.turn] && RULES.PACKAGES[a.pkg]) pickPkg(+a.pkg, +a.star);
    else if (a.type === 'r4ans' && r.st === 'answer' && t === r.order[r.turn] && a.ts <= r.deadline + 300) mainAnswer(a.c);
    else if (a.type === 'buzz' && r.st === 'buzz' && t !== r.order[r.turn] && a.ts <= r.deadline + 300) { r.buzzer = t; r.st = 'steal'; setDl(r, RULES.STEAL_TIME); }
    else if (a.type === 'r4steal' && r.st === 'steal' && t === r.buzzer && a.ts <= r.deadline + 300) stealResult(a.c);
  }
  else if (g.round === 5 && g.r5 && g.status === 'play') {
    const r = g.r5;
    if (a.type === 'buzz' && r.st === 'buzz' && r.alive.includes(t) && a.ts <= r.deadline + 300) { r.buzzer = t; r.st = 'answer'; setDl(r, RULES.TB_ANSWER_TIME); }
    else if (a.type === 'tbans' && r.st === 'answer' && t === r.buzzer && a.ts <= r.deadline + 300) tbResult(a.c);
  }
  commit();
}
function onJoin(a) {
  const reject = msg => { H.rejects[a.dev] = { msg, jid: a.jid }; };
  if (H.phase !== 'lobby' && H.phase !== 'game') return reject('Phòng thi chưa mở hoặc đã đóng.');
  const t = H.teams.findIndex(x => x.pin === String(a.pin).trim());
  if (t < 0) return reject('Mã PIN không đúng. Kiểm tra lại với giáo viên.');
  const other = H.teams.findIndex((x, i) => i !== t && x.dev === a.dev);
  if (other >= 0) return reject(`Thiết bị này đã vào ${H.teams[other].name}.`);
  if (H.teams[t].dev && H.teams[t].dev !== a.dev) return reject(`${H.teams[t].name} đã có người vào. Mỗi đội chỉ vào được 1 lần.`);
  H.teams[t].dev = a.dev; delete H.rejects[a.dev];
}
function setDl(r, sec) { r.start = Net.now(); r.deadline = r.start + sec * 1000; r.total = sec; }

/* ---------- Vòng 1: Khởi động ---------- */
function startR1() {
  const g = H.g, qs = g.bank.r1, now = Net.now();
  g.round = 1; g.status = 'play';
  g.r1 = { startAt: now + 3000, deadline: now + 3000 + RULES.R1_TIME * 1000,
    sets: H.teams.map(() => shuffle(qs.map((_, i) => i)).map(qi => ({ qi, perm: shuffle(qs[qi].opts.map((_, k) => k)) }))),
    prog: H.teams.map(() => []) };
}
function onR1(a) {
  const g = H.g, r = g.r1; if (g.status !== 'play' || a.ts > r.deadline + 300) return;
  const p = r.prog[a.team]; if (p.length !== a.idx) return;
  const s = r.sets[a.team][a.idx], q = g.bank.r1[s.qi], ok = s.perm[a.c] === q.ans;
  p.push({ c: a.c, ok, a: s.perm.indexOf(q.ans) }); if (ok) H.teams[a.team].score += RULES.R1_POINT;
  if (r.prog.every((x, i) => x.length >= r.sets[i].length)) g.status = 'review';
}

/* ---------- Vòng 2: Vượt chướng ngại vật ---------- */
function startR2() {
  const g = H.g; g.status = 'play';
  g.r2 = { row: -1, rs: 'idle', start: 0, deadline: 0, finalDl: 0, solved: -1,
    ans: g.bank.r2.map(() => H.teams.map(() => null)), opened: g.bank.r2.map(() => false), cnv: H.teams.map(() => null) };
}
function h_openRow(i) { const r = H.g.r2; r.row = i; r.rs = 'play'; setDl(r, RULES.R2_ROW_TIME); commit(); }
function revealRow() { const r = H.g.r2; r.rs = 'reveal'; r.opened[r.row] = true; }
function onR2(a) {
  const g = H.g, r = g.r2; if (g.status !== 'play' || r.rs !== 'play' || a.row !== r.row || r.ans[r.row][a.team] || a.ts > r.deadline + 300) return;
  const ok = a.c === g.bank.r2[r.row].ans;
  r.ans[r.row][a.team] = { c: a.c, ok, t: a.ts - r.start }; if (ok) H.teams[a.team].score += RULES.R2_POINT;
  if (r.ans[r.row].every(Boolean)) revealRow();
}
function onCnv(a) {
  const g = H.g, r = g.r2; if (!g.bank.cnv || r.cnv[a.team] || !['play', 'final'].includes(g.status)) return;
  const opened = r.opened.filter(Boolean).length; if (g.status === 'play' && opened < 1) return;
  if (g.status === 'final' && a.ts > r.finalDl + 300) return;
  const ok = a.c === g.bank.cnv.ans, P = RULES.CNV_POINTS;
  const pts = g.status === 'final' ? P[P.length - 1] : P[Math.min(opened, P.length) - 1];
  r.cnv[a.team] = { c: a.c, ok, pts: ok ? pts : 0 }; if (ok) H.teams[a.team].score += pts;
  if (ok && g.status === 'play') { r.solved = a.team; if (r.rs === 'play') revealRow(); g.status = 'review'; }

}
function h_finalCnv() { const g = H.g, r = g.r2; g.status = 'final'; r.finalDl = Net.now() + RULES.CNV_FINAL_TIME * 1000; commit(); }

/* ---------- Vòng 3: Tăng tốc ---------- */
function startR3() { const g = H.g; g.status = 'play'; g.r3 = { q: -1, qs: 'idle', start: 0, deadline: 0, ans: g.bank.r3.map(() => H.teams.map(() => null)), award: g.bank.r3.map(() => H.teams.map(() => 0)) }; }
function h_openR3(i) { const r = H.g.r3; r.q = i; r.qs = 'play'; setDl(r, RULES.R3_TIME); commit(); }
function onR3(a) {
  const g = H.g, r = g.r3; if (r.qs !== 'play' || a.q !== r.q || r.ans[r.q][a.team] || a.ts > r.deadline + 300) return;
  r.ans[r.q][a.team] = { c: a.c, ok: a.c === g.bank.r3[r.q].ans, t: a.ts - r.start };
  if (r.ans[r.q].every(Boolean)) revealR3();
}
function revealR3() {
  const r = H.g.r3; r.qs = 'reveal';
  r.ans[r.q].map((x, i) => ({ x, i })).filter(o => o.x && o.x.ok).sort((a, b) => a.x.t - b.x.t)
    .forEach((o, k) => { const pts = RULES.R3_POINTS[k] ?? RULES.R3_POINTS[RULES.R3_POINTS.length - 1]; r.award[r.q][o.i] = pts; H.teams[o.i].score += pts; });
}

/* ---------- Vòng 4: Về đích ---------- */
function startR4() {
  const g = H.g; g.status = 'play';
  g.r4 = { order: H.teams.map((_, i) => i), turn: 0, st: 'pick', pkg: 0, star: -1, qs: [], qi: 0, hist: [], start: 0, deadline: 0, total: 0, main: null, buzzer: -1, steal: null,
    left: { 20: shuffle(g.bank.v[20]), 30: shuffle(g.bank.v[30]), 40: shuffle(g.bank.v[40]) } };
}
function drawR4(pts) {
  const g = H.g, l = g.r4.left;
  if (l[pts].length) return l[pts].shift();
  for (const k of [20, 30, 40]) if (l[k].length) return l[k].shift();
  const all = [...g.bank.v[20], ...g.bank.v[30], ...g.bank.v[40]];   // chỉ dùng lại câu Về đích, không lấy câu vòng khác
  return all.length ? all[Math.floor(Math.random() * all.length)] : { text: '(Chưa có câu hỏi Về đích – hãy thêm câu có mã [VD20]/[VD30]/[VD40])', opts: ['—', '—', '—', '—'], ans: 0 };
}
function pickPkg(pkg, star) {
  const r = H.g.r4; r.pkg = pkg; r.star = star >= 0 && star < 3 ? star : -1;
  r.qs = RULES.PACKAGES[pkg].map(pts => ({ q: drawR4(pts), pts })); r.qi = 0; r.hist = []; r.st = 'ready';
}
function h_showQ() { const r = H.g.r4; r.main = null; r.buzzer = -1; r.steal = null; r.st = 'answer'; setDl(r, RULES.R4_TIME[r.qs[r.qi].pts] || 20); commit(); }
function mainAnswer(c) {
  const r = H.g.r4, cur = r.qs[r.qi], act = r.order[r.turn], ok = c === cur.q.ans;
  r.main = { c, ok };
  if (ok) { H.teams[act].score += cur.pts * (r.star === r.qi ? 2 : 1); r.hist[r.qi] = 'ok'; r.st = 'reveal'; }
  else { if (r.star === r.qi) H.teams[act].score -= cur.pts; r.hist[r.qi] = 'bad'; r.st = 'buzz'; setDl(r, RULES.BUZZ_TIME); }
}
function stealResult(c) {
  const r = H.g.r4, cur = r.qs[r.qi], act = r.order[r.turn], ok = c === cur.q.ans;
  r.steal = { c, ok };
  if (ok) { H.teams[r.buzzer].score += cur.pts; if (RULES.STEAL_TAKES_FROM_MAIN) H.teams[act].score -= cur.pts; r.hist[r.qi] = 'steal'; }
  else H.teams[r.buzzer].score -= cur.pts / 2;
  r.st = 'reveal';
}
function h_nextQ() {
  const g = H.g, r = g.r4;
  if (r.qi < r.qs.length - 1) { r.qi++; r.st = 'ready'; r.main = null; r.buzzer = -1; r.steal = null; }
  else if (r.turn < r.order.length - 1) { r.turn++; Object.assign(r, { st: 'pick', pkg: 0, star: -1, qs: [], qi: 0, hist: [], main: null, buzzer: -1, steal: null }); }
  else finishOrTie();
  commit();
}
/* ---------- Câu hỏi phụ: phân định các đội bằng điểm ---------- */
function tieGroup() {   // nhóm đội bằng điểm có thứ hạng cao nhất
  const rk = rankOf(H.teams);
  for (const x of rk) { const grp = rk.filter(y => y.score === x.score && (y.tb || 0) === (x.tb || 0)).map(y => y.i); if (grp.length > 1) return grp; }
  return null;
}
function finishOrTie() {
  const grp = tieGroup(), g = H.g;
  if (grp && g.bank.tb && g.bank.tb.length) {
    g.round = 5; g.status = 'intro'; UI.tab = 'main';
    g.r5 = { group: grp, alive: [...grp], st: 'ready', qi: -1, q: null, left: g.r5 ? g.r5.left : shuffle(g.bank.tb), start: 0, deadline: 0, total: 0, buzzer: -1, res: null, msg: '' };
  } else { H.phase = 'end'; UI.confetti = false; }
}
function h_tbShow() {
  const g = H.g, r = g.r5;
  r.q = r.left.length ? r.left.shift() : g.bank.tb[Math.floor(Math.random() * g.bank.tb.length)];
  r.qi++; r.st = 'buzz'; r.buzzer = -1; r.res = null; r.msg = ''; setDl(r, RULES.TB_BUZZ_TIME); commit();
}
function tbResult(c) {
  const r = H.g.r5, t = r.buzzer, ok = c === r.q.ans;
  r.res = { c, ok, team: t };

  else { H.teams[t].tb = (H.teams[t].tb || 0) - 1; r.alive = r.alive.filter(x => x !== t); r.msg = `${H.teams[t].name} ${c < 0 ? 'hết giờ' : 'trả lời sai'} – xếp dưới các đội còn lại`; }
  r.st = 'reveal';
}
function h_tbNext() {   // sau mỗi câu phụ: còn bằng điểm thì hỏi tiếp, hết thì kết thúc
  const g = H.g, r = g.r5, grp = tieGroup();
  if (grp && g.bank.tb.length) { Object.assign(r, { group: grp, alive: [...grp], st: 'ready', q: null, buzzer: -1, res: null, msg: '' }); g.status = 'play'; }

}
function h_tbSkip() { if (confirm('Bỏ qua câu hỏi phụ và xem kết quả (các đội bằng điểm sẽ đồng hạng)?')) { H.phase = 'end'; UI.confetti = false; commit(); } }
function h_pickFor(pkg) { pickPkg(pkg, -1); commit(); }

/* ---------- Đồng hồ máy chủ ---------- */
function hostTick() {
  if (H.phase !== 'game') return;
  const g = H.g, now = Net.now(); let ch = false;
  if (g.round === 1 && g.status === 'play' && g.r1 && now > g.r1.deadline) { g.status = 'review'; ch = true; }
  if (g.round === 2 && g.r2) {
    if (g.status === 'play' && g.r2.rs === 'play' && now > g.r2.deadline) { revealRow(); ch = true; }
    if (g.status === 'final' && now > g.r2.finalDl) { g.status = 'review'; ch = true; }
  }
  if (g.round === 3 && g.r3 && g.r3.qs === 'play' && now > g.r3.deadline) { revealR3(); ch = true; }
  if (g.round === 4 && g.r4 && g.status === 'play' && now > g.r4.deadline) {
    const r = g.r4;
    if (r.st === 'answer') { mainAnswer(-1); ch = true; }
    else if (r.st === 'buzz') { r.st = 'reveal'; ch = true; }
    else if (r.st === 'steal') { stealResult(-1); ch = true; }
  }
  if (g.round === 5 && g.r5 && g.status === 'play' && now > g.r5.deadline) {
    const r = g.r5;
    if (r.st === 'buzz') { r.st = 'reveal'; r.res = null; r.msg = 'Không đội nào bấm chuông – GV hiện câu hỏi phụ tiếp theo'; ch = true; }
    else if (r.st === 'answer') { tbResult(-1); ch = true; }
  }
  if (ch) commit();
}

/* ---------- Nút điều khiển của GV ---------- */
function h_tab(t) { UI.tab = t; renderHost(); }
function h_openLobby() {
  if (H.teams.some(t => !t.members.length) && !confirm('Có đội chưa có thành viên. Vẫn mở phòng chờ?')) return;
  const old = H.teams.map(t => t.pin), pins = makePins(H.teams.length);
  H.teams.forEach((t, i) => { t.pin = pins[i]; t.dev = null; t.score = 0; });
  H.rejects = {}; H.g = null; H.phase = 'lobby'; UI.showPin = {};
  Net.registerPins(H.roomId, pins, old); listen(); commit();
}
function h_regenPins() { if (confirm('Tạo mã PIN mới? Các đội đã vào sẽ phải nhập lại.')) h_openLobby(); }
function h_unlock(t) { if (confirm(`Mở khóa ${H.teams[t].name}? Thiết bị đang vào sẽ bị thoát, đội có thể nhập lại PIN trên máy khác.`)) { H.teams[t].dev = null; commit(); } }
function h_start() {
  if (!H.teams.every(t => t.dev)) return;
  const bank = buildBank(H.bankText);
  if (!bank.r1.length) return alert('Bộ câu hỏi chưa có câu nào cho vòng Khởi động.');
  H.teams.forEach(t => { t.score = 0; t.tb = 0; }); H.phase = 'game'; H.g = { round: 1, status: 'intro', bank }; UI.tab = 'main';
  startR1(); commit();
}
function h_startRound() {
  const g = H.g;
  if (g.round === 2) { if (!g.bank.r2.length) { g.round = 3; g.status = 'intro'; return commit(); } startR2(); }
  else if (g.round === 3) startR3(); else if (g.round === 4) startR4(); else if (g.round === 5) g.status = 'play';
  commit();
}
function h_endRound() { const g = H.g; if (g.round === 2 && g.r2 && g.r2.rs === 'play') revealRow(); if (g.round === 3 && g.r3 && g.r3.qs === 'play') revealR3(); g.status = 'review'; commit(); }
function h_revealNow() { const g = H.g; if (g.round === 2) revealRow(); if (g.round === 3) revealR3(); commit(); }
function h_nextRound() { const g = H.g; if (g.round >= 4) finishOrTie(); else { g.round++; g.status = 'intro'; } UI.tab = 'main'; commit(); }
function h_replay() { H.teams.forEach(t => { t.score = 0; t.tb = 0; }); H.g = null; H.phase = 'lobby'; commit(); }
function closeRoom() { Net.publish(H.roomId, { roomId: H.roomId, phase: 'closed', teams: [], rejects: {} }); }
function h_backSetup() { if (!confirm('Quay lại chia đội? Phòng hiện tại sẽ đóng, mã PIN cũ hết hiệu lực.')) return; closeRoom(); H.teams.forEach(t => { t.dev = null; t.score = 0; }); H.phase = 'setup'; H.g = null; commit(); }
function h_resetAll() { if (!confirm('Xóa toàn bộ (danh sách, đội, bộ câu hỏi) và làm lại từ đầu?')) return; closeRoom(); H = hostDefault(); commit(); }
function h_fullscreen() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => { }); }

/* ---------- Danh sách lớp & chia đội ---------- */
async function h_rosterFile(file) {
  if (!file) return;
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
    let start = 0, nameCol = -1, hoCol = -1, tenCol = -1;
    for (let i = 0; i < Math.min(rows.length, 12); i++) {
      const r = rows[i].map(c => norm(c));
      tenCol = r.findIndex(c => c === 'TEN'); hoCol = r.findIndex(c => c.startsWith('HO') && !c.includes('TEN'));
      nameCol = r.findIndex(c => c.includes('TEN') && c !== 'TEN');
      if (nameCol >= 0 || tenCol >= 0) { start = i + 1; break; }
    }
    let list;
    if (nameCol < 0 && tenCol >= 0 && hoCol >= 0) list = rows.slice(start).map(r => `${r[hoCol]} ${r[tenCol]}`.trim());
    else {
      if (nameCol < 0) nameCol = tenCol >= 0 ? tenCol : (rows[0] && /^\d+$/.test(String(rows[0][0]).trim()) ? 1 : 0);
      list = rows.slice(start).map(r => String(r[nameCol] ?? '').trim());
    }
    list = list.filter(n => n && !/^\d+$/.test(n));
    if (!list.length) return alert('Không tìm thấy cột tên học sinh. File cần có cột "Họ và tên".');
    setStudents(list, `Đã nạp ${list.length} học sinh từ "${file.name}"`);

function setStudents(list, msg) { H.students = list; H.teams.forEach(t => t.members = []); UI.msg = msg; divide('order', true); }
function divide(mode, silent) {
  if (!H.students.length) return alert('Chưa có danh sách lớp.');
  const list = mode === 'random' ? shuffle(H.students) : [...H.students];

/* Tìm danh sách lớp đã nạp ở trang chủ (cùng trình duyệt) */
const NAME_KEYS = ['name', 'fullName', 'fullname', 'hoTen', 'hoten', 'ho_ten', 'Họ và tên', 'Họ tên', 'studentName', 'ten'];
function collectNames(v, out, depth = 0, listKey = false) {
  if (depth > 5 || v == null) return;
  if (Array.isArray(v)) { v.forEach(x => typeof x === 'string' ? (listKey && out.push(x)) : collectNames(x, out, depth + 1, listKey)); return; }
  if (typeof v === 'object') for (const k in v) {
    if (typeof v[k] === 'string' && NAME_KEYS.includes(k)) out.push(v[k]);
    else collectNames(v[k], out, depth + 1, /student|member|roster|danh|hocsinh|names/i.test(k));
  }
}
function findSavedRoster() {
  let best = null;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i); if (k.startsWith('olp_')) continue;
    let v; try { v = JSON.parse(localStorage.getItem(k)); } catch (e) { continue; }
    const out = []; collectNames(v, out);
    const names = [...new Set(out.map(s => String(s).trim()).filter(s => s.length > 1 && s.length < 50 && !/^(Đội|Tổ|Nhóm|Team|Lớp)\s*\d*/i.test(s)))];
    if (names.length >= 4 && (!best || names.length > best.names.length)) best = { k, names };
  }
  return best;
}

async function h_bankFile(file) {
  if (!file) return;
  try {
    let text, note = '';
    if (/\.tex$/i.test(file.name)) {
      const r = texToBank(await file.text()); text = r.text;
      note = `Đã đọc ${r.n} câu trắc nghiệm từ file LaTeX` + (r.skipped ? ` (bỏ qua ${r.skipped} câu không phải \\choice 4 đáp án hoặc thiếu \\True)` : '') + '.';
    } else text = /\.docx$/i.test(file.name) ? (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value : await file.text();
    const b = buildBank(text);
    if (note) setTimeout(() => alert(note), 50);
    if (!b.total) return alert('Không nhận được câu hỏi nào. Kiểm tra định dạng: "Câu 1: ...", "A. ...", "Đáp án: A".');
    H.bankText = text; H.bankName = file.name; commit();
  } catch (e) { alert('Không đọc được file: ' + e.message); }
}

const T = { dev: null, room: null, pin: null, jid: null, p: null, t: -1, err: '', wasIn: false, pend: null, cnvOpen: false, pick: { pkg: 0, star: -1 }, listenRoom: null, joinTimer: null, lastKey: '' };

async function teamJoin(pin) {

  Net.listenPub(room, teamOnPub);

  clearTimeout(T.joinTimer);
  T.joinTimer = setTimeout(() => { if (T.t < 0 && T.connecting) { T.connecting = false; T.room = null; T.err = 'Máy giáo viên chưa phản hồi. Kiểm tra giáo viên đã mở phòng chờ chưa rồi thử lại.'; renderTeam(); } }, 8000);

function pinError() {
