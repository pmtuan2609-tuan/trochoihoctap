<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>

    <!-- Main Controller Gradient -->
    <linearGradient id="controllerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Graduation Cap Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Neon Accent Glow -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.45"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base Badge -->
  <rect x="25" y="25" width="450" height="450" rx="90" fill="url(#bgGlow1)" stroke="#334155" stroke-width="3"/>
  <rect x="35" y="35" width="430" height="430" rx="80" fill="none" stroke="url(#controllerGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Background Sparkles -->
  <path d="M100 130 Q105 145 120 150 Q105 155 100 170 Q95 155 80 150 Q95 145 100 130 Z" fill="#38bdf8" opacity="0.7"/>
  <path d="M400 140 Q403 150 415 153 Q403 156 400 166 Q397 156 385 153 Q397 150 400 140 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M110 360 Q113 368 122 371 Q113 374 110 382 Q107 374 98 371 Q107 368 110 360 Z" fill="#f43f5e" opacity="0.7"/>

  <!-- MAIN GAME CONTROLLER BODY -->
  <g filter="url(#shadowGlow)">
    <!-- Controller Silhouette -->
    <path d="M150 210 C120 210 90 240 85 290 C80 340 100 390 140 390 C170 390 185 350 210 350 L290 350 C315 350 330 390 360 390 C400 390 420 340 415 290 C410 240 380 210 350 210 Z" 
          fill="url(#controllerGrad)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6"/>

    <!-- Controller Inner Shadow Line -->
    <path d="M155 230 C135 230 115 250 110 290 C105 330 120 365 145 365 C165 365 178 335 210 335 L290 335 C322 335 335 365 355 365 C380 365 395 330 390 290 C385 250 365 230 345 230 Z" 
          fill="#0f172a" opacity="0.35"/>

    <!-- D-Pad (Left) -->
    <!-- Horizontal bar -->
    <rect x="130" y="275" width="50" height="18" rx="5" fill="#ffffff" opacity="0.95"/>
    <!-- Vertical bar -->
    <rect x="146" y="259" width="18" height="50" rx="5" fill="#ffffff" opacity="0.95"/>
    <circle cx="155" cy="284" r="4" fill="#0284c7"/>

    <!-- Action Buttons (Right) - Star, Triangle, Circle, Diamond -->
    <circle cx="345" cy="265" r="9" fill="#f43f5e"/>
    <circle cx="365" cy="285" r="9" fill="#10b981"/>
    <circle cx="325" cy="285" r="9" fill="#fbbf24"/>
    <circle cx="345" cy="305" r="9" fill="#38bdf8"/>

    <!-- Center Bridge Line & Light -->
    <rect x="235" y="275" width="30" height="8" rx="4" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- GRADUATION CAP (MORTARBOARD) ON TOP -->
  <g filter="url(#goldGlow)">
    <!-- Cap Diamond Board -->
    <polygon points="250,100 360,150 250,195 140,150" fill="url(#capGrad)" stroke="#ffffff" stroke-width="4"/>
    <!-- Cap Under Skullcap -->
    <path d="M190 170 L190 205 C190 225 310 225 310 205 L310 170 Z" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Tassel Ribbon & Ring -->
    <circle cx="250" cy="148" r="7" fill="#ffffff"/>
    <path d="M250 148 Q295 160 320 200" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>
    <polygon points="315,195 328,225 312,225" fill="#fbbf24"/>
  </g>

  <!-- Bottom Brand Text -->
  <text x="250" y="435" text-anchor="middle" font-family="'Baloo 2', 'Be Vietnam Pro', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="3">
    EDU<tspan fill="#38bdf8">PLAY</tspan>
  </text>
</svg>
