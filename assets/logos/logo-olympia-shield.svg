<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050a12" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="goldGlow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect x="25" y="25" width="450" height="450" rx="90" fill="url(#bgGlow3)" stroke="#334155" stroke-width="3"/>

  <!-- LAUREL WREATH (OLYMPIA) -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <!-- Left Leaves -->
    <path d="M110 320 Q80 250 110 180 Q100 220 130 250 Q90 280 110 320 Z"/>
    <path d="M130 180 Q110 130 160 100 Q140 140 170 160 Z"/>
    <path d="M170 110 Q160 70 210 60 Q180 90 200 120 Z"/>
    
    <!-- Right Leaves -->
    <path d="M390 320 Q420 250 390 180 Q400 220 370 250 Q410 280 390 320 Z"/>
    <path d="M370 180 Q390 130 340 100 Q360 140 330 160 Z"/>
    <path d="M330 110 Q340 70 290 60 Q320 90 300 120 Z"/>
  </g>

  <!-- CHAMPION SHIELD -->
  <g filter="url(#goldGlow3)">
    <!-- Outer Golden Crest -->
    <path d="M250 90 L360 130 C360 260 250 350 250 350 C250 350 140 260 140 130 Z" 
          fill="url(#shieldFill)" stroke="url(#goldGrad)" stroke-width="8"/>

    <!-- Inner Shield Inset -->
    <path d="M250 115 L335 150 C335 250 250 320 250 320 C250 320 165 250 165 150 Z" 
          fill="#090d16" stroke="url(#emeraldGrad)" stroke-width="2"/>

    <!-- Open Knowledge Book Wings -->
    <path d="M250 240 Q210 220 180 225 L180 265 Q210 260 250 280 Q290 260 320 265 L320 225 Q290 220 250 240 Z" 
          fill="#38bdf8" opacity="0.9"/>
    <line x1="250" y1="240" x2="250" y2="280" stroke="#ffffff" stroke-width="3"/>

    <!-- Gaming D-Pad in the Golden Shield Center -->
    <g transform="translate(250, 185)">
      <!-- Cross Bar -->
      <rect x="-24" y="-7" width="48" height="14" rx="4" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="-7" y="-24" width="14" height="48" rx="4" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#0f172a"/>
    </g>

    <!-- Top Crown / Trophy Star -->
    <polygon points="250,55 258,72 277,72 262,83 268,100 250,89 232,100 238,83 223,72 242,72" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Bottom Brand Text -->
  <text x="250" y="415" text-anchor="middle" font-family="'Baloo 2', 'Be Vietnam Pro', sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="3">
    OLYMPIA<tspan fill="#f59e0b">CHAMP</tspan>
  </text>
  <text x="250" y="442" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="12" fill="#34d399" letter-spacing="4">
    ĐẤU TRƯỜNG VÔ ĐỊCH
  </text>
</svg>
