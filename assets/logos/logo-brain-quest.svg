<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="brainGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#ec4899" flood-opacity="0.5"/>
    </filter>

    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#fbbf24" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="25" y="25" width="450" height="450" rx="90" fill="url(#bgGlow2)" stroke="#334155" stroke-width="3"/>
  <rect x="35" y="35" width="430" height="430" rx="80" fill="none" stroke="url(#brainGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Background Cyber Circuit Lines -->
  <path d="M120 100 L120 180 L160 200" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.4"/>
  <path d="M380 100 L380 180 L340 200" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.4"/>
  <circle cx="120" cy="100" r="5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="380" cy="100" r="5" fill="#a855f7" opacity="0.6"/>

  <!-- SMART BRAIN / GAMING MENTAL POWER ICON -->
  <g filter="url(#brainGlow)">
    <!-- Left Hemisphere -->
    <path d="M235 150 C210 120 160 120 135 150 C110 180 110 220 130 250 C110 280 120 330 160 345 C190 355 220 340 235 320 Z" 
          fill="url(#brainGrad)" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Right Hemisphere -->
    <path d="M265 150 C290 120 340 120 365 150 C390 180 390 220 370 250 C390 280 380 330 340 345 C310 355 280 340 265 320 Z" 
          fill="url(#brainGrad)" stroke="#ffffff" stroke-width="4"/>

    <!-- Brain Folds / Circuit Grooves -->
    <path d="M165 170 Q195 190 170 230 Q150 250 185 270 Q160 300 200 320" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M335 170 Q305 190 330 230 Q350 250 315 270 Q340 300 300 320" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- GAMING LIGHTNING BOLT IN THE CENTER -->
  <g filter="url(#boltGlow)">
    <polygon points="265,110 215,225 255,225 230,340 305,205 260,205" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="4"/>
  </g>

  <!-- Floating Arcade Quest Stars -->
  <polygon points="120,240 125,252 138,252 127,260 131,272 120,264 109,272 113,260 102,252 115,252" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5"/>
  <polygon points="380,240 385,252 398,252 387,260 391,272 380,264 369,272 373,260 362,252 375,252" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Bottom Brand Text -->
  <text x="250" y="415" text-anchor="middle" font-family="'Baloo 2', 'Be Vietnam Pro', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="3">
    BRAIN<tspan fill="#f59e0b">QUEST</tspan>
  </text>
  <text x="250" y="442" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="12" fill="#94a3b8" letter-spacing="4">
    ĐẤU TRƯỜNG TRÍ TUỆ
  </text>
</svg>
